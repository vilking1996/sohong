name: Nhận và cập nhật dữ liệu ví từ web offline

on:
  repository_dispatch:
    types: [update_balance]

jobs:
  update_balance:
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 Checkout code
        uses: actions/checkout@v4

      - name: 📥 Đọc dữ liệu event
        id: parse
        run: |
          echo "📩 Nhận dữ liệu sự kiện từ web offline..."
          echo "NAME=$(jq -r '.client_payload.name' $GITHUB_EVENT_PATH)" >> $GITHUB_ENV
          echo "BALANCE=$(jq -r '.client_payload.balance' $GITHUB_EVENT_PATH)" >> $GITHUB_ENV
          echo "HASH=$(jq -r '.client_payload.hash' $GITHUB_EVENT_PATH)" >> $GITHUB_ENV
          echo "HISTORY=$(jq -c '.client_payload.history' $GITHUB_EVENT_PATH)" >> $GITHUB_ENV

      - name: ✅ Kiểm tra hash hợp lệ
        run: |
          if [ "$HASH" != "a1b2c3d4e5" ]; then
            echo "❌ Hash sai, hủy cập nhật."
            exit 1
          fi
          echo "✅ Hash hợp lệ, tiếp tục..."

      - name: 🧩 Cập nhật Blockchain.html cho block đúng tên
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # Tạo HTML lịch sử
          HISTORY_HTML=$(echo "$HISTORY" | jq -r '.[] | 
            "<li style=\"margin-bottom:10px;line-height:1.4em;\">" +
            (if .note then "ℹ️ " + .note + "<br>" else "" end) +
            (if .type == "send" then "🔻 Chuyển " else "🔼 Nhận " end) +
            (.amount|tostring) + 
            (if .type == "send" then " cho " else " từ " end) +
            (.partner // "ẩn danh") + 
            " bởi " + "'"$NAME"'" +
            " lúc " + (.time // "??") + 
            " 📍(" + (.location // "??") + ")" + 
            " | TX:" + ((.tx // "")[:12]) + "…" +
            " | Số dư: " + (.balance|tostring) + 
            "</li>"' | tr '\n' ' ')

          # Update chỉ block có data-name="$NAME"
          awk -v name="$NAME" -v balance="$BALANCE" -v history="$HISTORY_HTML" '
            BEGIN{RS=""; ORS="\n\n"}
            {
              if ($0 ~ "data-name=\""name"\"") {
                # Giữ icon đầu/cuối 💰...💸
                gsub(/(💰)[0-9,]+\.[0-9]+(💸)/,"\\1"balance"\\2")
                # Update popup lịch sử
                gsub(/data-history=.*/,"data-history='\''"history"'\''")
              }
              print
            }
          ' Blockchain.html > tmp.html && mv tmp.html Blockchain.html

          git add Blockchain.html
          git commit -m "🔄 Cập nhật số dư và lịch sử cho $NAME ($BALANCE)" || echo "Không có thay đổi"
          git push

      - name: ✅ Log kết quả
        run: |
          echo "Đã cập nhật ví $NAME với số dư 💲$BALANCE🪙"
