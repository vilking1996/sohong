<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fire Seal Border Aluminum</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
<style>
body{
 margin:0;height:100vh;
 display:flex;justify-content:center;align-items:center;
 background:url('https://cafefcdn.com/203337114487263232/2021/11/27/photo-7-16379804420911098733601.jpg');background-size:cover;
}
#bar{width:360px;cursor:pointer}
.popup{
 position:fixed;inset:0;
 background:rgba(0,0,0,.85);
 display:none;justify-content:center;align-items:center;
}
.paper{
 position:relative;
 width:360px;
 background:bb1710;
 padding:16px;
 border-radius:18px;
 color:#bb1177;
 box-shadow:0 0 40px #ffae00;
}
canvas#fire{
 position:absolute;
 top:-12px;
 left:-12px;
 width:calc(100% + 24px);
 height:calc(100% + 24px);
 pointer-events:none;
}

input{width:100%;margin:4px 0;padding:5px}
canvas#sign{border:1px dashed #333;width:100%;height:80px;touch-action:none}
#meta{font-size:12px}
#qr{display:flex;justify-content:center;margin-top:6px}







#bar3d{
 transform-origin:center;
 transform-box:fill-box;
 animation:spin360 9s linear infinite;
}

@keyframes spin360{
 from{transform:rotateY(0deg);}
 to{transform:rotateY(360deg);}
}




</style>
</head>

<body>




<svg id="bar" viewBox="0 0 420 220" style="cursor:pointer" width="360">
<defs>

<!-- Kim loại -->
<linearGradient id="metalTop" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#ffffff"/>
 <stop offset="30%" stop-color="#d6dadf"/>
 <stop offset="60%" stop-color="#9aa0a6"/>
 <stop offset="100%" stop-color="#6a7075"/>
</linearGradient>

<linearGradient id="metalSide" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#6c7176"/>
 <stop offset="100%" stop-color="#2f3235"/>
</linearGradient>

<!-- Ánh kim -->
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
 <stop offset="40%" stop-color="#ffffff" stop-opacity="0.2"/>
 <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>

<!-- Shadow -->
<filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
 <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
</filter>

<!-- KHẮC ĐÚC CHỮ -->
<filter id="engrave" x="-20%" y="-20%" width="140%" height="140%">
 <feOffset dx="1.5" dy="1.5" in="SourceAlpha" result="off"/>
 <feGaussianBlur stdDeviation="1.2" in="off" result="blur"/>
 <feComposite in="SourceGraphic" in2="blur" operator="arithmetic" k2="1" k3="-1"/>
</filter>

</defs>

<!-- Bóng -->
<ellipse cx="210" cy="165" rx="150" ry="18" fill="rgba(0,0,0,0.35)"/>

<g id="bar3d" filter="url(#shadow)">

 <!-- Mặt bên -->
 <polygon points="95,135 380,95 380,130 95,170"
 fill="url(#metalSide)"/>

 <!-- Mặt trên bo tròn -->
 <path d="
 M40 75
 Q55 55 90 65
 L330 40
 Q360 45 380 80
 L95 135
 Q70 140 40 110
 Z" fill="url(#metalTop)"/>

 <!-- Highlight -->
 <path d="
 M60 75
 L300 50
 L325 60
 L85 85
 Z" fill="url(#shine)" />

 <!-- LOGO KHẮC ĐÚC -->
 <text x="120" y="95"
 fill="#777"
 font-size="14"
 font-weight="bold"
 style="letter-spacing:1.2px"
 filter="url(#engrave)">
 STORMWIND
 </text>

 <!-- CHỮ KHẮC ĐÚC CHÍNH -->
 <text x="275" y="75"
 text-anchor="middle"
 fill="#888"
 font-size="20"
 font-weight="bold"
 style="letter-spacing:2px"
 filter="url(#engrave)">
 💰75💸
 </text>

</g>

<!-- Lấp lánh kim loại -->
<circle cx="110" cy="85" r="1.6" fill="#fff" opacity="0.7"/>
<circle cx="260" cy="70" r="1.4" fill="#fff" opacity="0.6"/>
<circle cx="310" cy="95" r="1.8" fill="#fff" opacity="0.8"/>

</svg>




<div class="popup" id="popup">
<div class="paper" id="receipt">
<canvas id="fire"></canvas>

<h2 style="text-align:center">📜NHÔM STORMWIND📜</h2>

Số thỏi:
<input type="number" id="qty" value="1" min="1">
Tổng kg:
<input id="kg" readonly>
Tổng USD:
<input id="usd" readonly>
Người mua:
<input id="buyer">

Chữ ký:
<canvas id="sign"></canvas>

<div id="meta"></div>
<div id="qr"></div>

<button onclick="closePopup()">Đóng</button>
</div>
</div>

<script>
const price=75,weight=25;
bar.onclick=()=>{
 popup.style.display="flex";
 requestGPS();
 resizeFire();
};
function closePopup(){popup.style.display="none";}
qty.oninput=calc;
function calc(){kg.value=qty.value*weight;usd.value=qty.value*price;}
calc();


let gpsText="...";
let gpsRequested=false;
function requestGPS(){
 if(gpsRequested) return;
 gpsRequested=true;
 if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(pos=>{
   gpsText=pos.coords.latitude.toFixed(4)+","+pos.coords.longitude.toFixed(4);
  },()=>gpsText="N/A");
 }
}


let sign=document.getElementById("sign"),ctx=sign.getContext("2d");
sign.width=300;sign.height=80;
ctx.lineWidth=2;ctx.lineCap="round";
let drawing=false,last={x:0,y:0};

function getPos(e){
 let r=sign.getBoundingClientRect();
 if(e.touches){
  return {x:e.touches[0].clientX-r.left,y:e.touches[0].clientY-r.top};
 }else return {x:e.offsetX,y:e.offsetY};
}

function start(e){e.preventDefault();drawing=true;last=getPos(e);}
function move(e){
 if(!drawing)return;
 let p=getPos(e);
 ctx.beginPath();
 ctx.moveTo(last.x,last.y);
 ctx.lineTo(p.x,p.y);
 ctx.stroke();
 last=p;
 updateSecurity();
}
function end(){drawing=false;}

sign.addEventListener("mousedown",start);
sign.addEventListener("mousemove",move);
sign.addEventListener("mouseup",end);
sign.addEventListener("touchstart",start,{passive:false});
sign.addEventListener("touchmove",move,{passive:false});
sign.addEventListener("touchend",end);

/* HASH */
async function hash256(str){
 let buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str));
 return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}

let qrObj=null;
async function updateSecurity(){
 if(!buyer.value.trim()) return; // chưa nhập thì không tạo QR

 let time=new Date().toLocaleString();
 let raw=buyer.value+qty.value+kg.value+usd.value+time+Math.random();
 let h=(await hash256(raw)).substring(0,17);
 let data=`Buyer:${buyer.value}|Qty:${qty.value}|KG:${kg.value}|USD:${usd.value}|Time:${time}|GPS:${gpsText}|Hash:${h}`;
 meta.innerHTML=`Hash:${h}<br>Time:${time}<br>GPS:${gpsText}`;
 if(!qrObj) qrObj=new QRCode(qr,{text:data,width:120,height:120});
 else{qrObj.clear();qrObj.makeCode(data);}
}


const fire=document.getElementById("fire"),fctx=fire.getContext("2d");
let t=0;
function resizeFire(){
 fire.width=receipt.clientWidth+24;
 fire.height=receipt.clientHeight+24;
}
function drawFireBorder(){
 let w=fire.width,h=fire.height;
 fctx.clearRect(0,0,w,h);
 for(let i=0;i<60;i++){
  let p=(t+i*15)%(2*(w+h));
  let x=0,y=0;
  if(p<w){x=p;y=0}
  else if(p<w+h){x=w;y=p-w}
  else if(p<2*w+h){x=2*w+h-p;y=h}
  else{x=0;y=2*(w+h)-p}
  let hue = (t*3 + i*12) % 360;
fctx.fillStyle = `hsla(${hue},100%,60%,0.9)`;


  fctx.beginPath();
  fctx.arc(x,y,3+Math.random()*2,0,Math.PI*2);
  fctx.fill();
 }
 t+=2;
 requestAnimationFrame(drawFireBorder);
}
drawFireBorder();






buyer.addEventListener("input", updateSecurity);
qty.addEventListener("input", ()=>{
 calc();
 updateSecurity();
});
</script>
</body>
</html>
