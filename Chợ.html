<style>
html,body{margin:0;height:100%;font-family:sans-serif}

button{

.leaflet-popup-content-wrapper{
position:relative;
background:linear-gradient(145deg,#111,#1a1a1a);
color:#ffe6f7;
border-radius:20px;
overflow:hidden;
box-shadow:
0 0 20px rgba(255,20,147,0.6),
0 0 40px rgba(255,0,204,0.4);
}


.leaflet-popup-content-wrapper::before{
content:"";
position:absolute;
inset:-2px;
border-radius:22px;
padding:2px;
background:linear-gradient(
90deg,
#ff00cc,
#ff69b4,
#ff1493,
#ff00cc
);
background-size:300% 300%;

pointer-events:none;



-webkit-mask:
linear-gradient(#000 0 0) content-box,
linear-gradient(#000 0 0);

0%{background-position:0% 50%;}

}

}

}

.fairy-product b{
color:#fff;
}

.fairy-images{
display:flex;
gap:6px;
overflow-x:auto;
margin:8px 0;
}

.fairy-images img{
height:100px;
border-radius:12px;
border:1px solid rgba(255,105,180,0.5);

}

.fairy-btn{

scroll-snap-align:start;
flex-shrink:0;
}

.fairy-product-card img{
width:100%;
height:100px;
object-fit:cover;
border-radius:12px;
margin-bottom:8px;
border:1px solid rgba(255,105,180,0.4);

    position:absolute;

<body>

<div id="coordinateBox">
    <input id="latInput" placeholder="Latitude">
    <input id="lngInput" placeholder="Longitude">
    <button onclick="goToCoordinate()">🎢Go🎪</button>
</div>





<div id="map"></div>

<!-- CART -->
<div id="cartIcon">
🛒
<div class="badge" id="cartCount">0</div>
</div>

<div id="cartPanel">
<h3>Giỏ hàng</h3>
<div id="cartItems"></div>
<hr>
Tổng: <b id="cartTotal">0</b> đ
<br><br>
<button class="btnMain" onclick="checkout()">Thanh toán</button>
<div id="invoiceArea"></div>
</div>

<!-- FORM -->
<div class="shopForm" id="shopForm">
<h3>🎪Tạo Shop🎪</h3>


<input id="shopName" class="input" placeholder="🎪Tên shop🎪">
<input id="shopPhone" class="input" placeholder="📳SĐT📳">
<input id="shopZalo" class="input" placeholder="📳Zalo📳">
<input id="shopAvatar" class="input" placeholder="🎭Link avatar🎭">
<input id="shopYoutube" class="input" placeholder="🖥Link Youtube🖥">
<input id="shopPassword" class="input" type="password" placeholder="🔒Password shop">
<select id="shopIcon" class="input">
<option value="restaurant">🍜 Nhà hàng</option>
<option value="coffee">☕ Cafe</option>
<option value="fastfood">🍔 Đồ ăn nhanh</option>
<option value="market">🛒 Tạp hóa</option>
<option value="clothes">👕 Thời trang</option>
<option value="phone">📱 Điện thoại</option>
<option value="pharmacy">💊 Nhà thuốc</option>
<option value="beauty">💄 Làm đẹp</option>
<option value="shipper">🚚 Shipper</option>
<option value="taxi">🚕 Taxi</option>
<option value="hotel">🏨 Khách sạn</option>
<option value="pet">🐶 Pet shop</option>
</select>







<label>
<input type="checkbox" id="shopStatus" checked> 🎢Đang mở cửa🎠
</label>

<hr>
<div id="products"></div>

<button onclick="addProduct()" class="btnGray">+ Thêm sản phẩm</button>
<br><br>
<button onclick="saveShop()" class="btnMain">Lưu Shop</button>
<button onclick="closeForm()" class="btnGray">Hủy</button>
</div>

<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<script>
let editMode = false

let myShopId = localStorage.getItem("myShopId") || null

const SERVER="https://blockchain-backup-server-2.onrender.com"



const socket = io(SERVER, {
    reconnectionAttempts: 3,
    transports: ["websocket"]
})

socket.on("connect",()=>{
    console.log("Connected:", socket.id)

    if(myShopId){
        socket.emit("reconnect_shop", {
            shopId: myShopId,
            ownerId: ownerId
        })
    }
})





let selectedLatLng=null
let markers=[]
let loadedShops={}
let loadedShopsData={}

let userLocation=null
let userMarker=null
let cart=[]

const businessIcons = {
restaurant:"🍜",
coffee:"☕",
fastfood:"🍔",
market:"🛒",
clothes:"👕",
phone:"📱",
pharmacy:"💊",
beauty:"💄",
shipper:"🚚",
taxi:"🚕",
hotel:"🏨",
pet:"🐶"
}




const map = L.map('map').setView([10.762622,106.660172],25)



const normalLayer = L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: '&copy; OpenStreetMap contributors'
        
    }
)


const satelliteLayer = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {
        attribution: 'Tiles © Esri'
        
    }
)


normalLayer.addTo(map)


L.control.layers(
    {
        "🌍 Bản đồ thường": normalLayer,
        "🛰 Vệ tinh thật": satelliteLayer
    }
).addTo(map)




if(navigator.geolocation){

    navigator.geolocation.getCurrentPosition(pos=>{

        userLocation = {
            lat: pos.coords.latitude,
            lng: pos.coords.longitude
        }

        
        map.setView([userLocation.lat,userLocation.lng],15)

        
        if(userMarker){
            map.removeLayer(userMarker)
        }

        
        const userIcon = L.divIcon({
            className:"",
            html:`
            <div style="
                width:50px;
                height:50px;
                border-radius:50%;
                background:linear-gradient(135deg,#00f2ff,#0077ff);
                border:4px solid white;
                box-shadow:0 0 20px cyan,0 0 40px #00f2ff;
                display:flex;
                align-items:center;
                justify-content:center;
                font-size:20px;
                color:white;
                font-weight:bold;
            ">
                📍
            </div>
            `,
            iconSize:[50,50]
        })

        userMarker = L.marker(
            [userLocation.lat,userLocation.lng],
            {icon:userIcon}
        ).addTo(map)
        .bindPopup("📍 Vị trí của bạn")

    },err=>{
        console.log("Không lấy được vị trí:",err)
    })
}





map.on("click",e=>{
selectedLatLng=e.latlng
openForm()
})

function openForm(){
document.getElementById("shopForm").style.display="block"
}

function closeForm(){
document.getElementById("shopForm").style.display="none"
document.getElementById("products").innerHTML=""
}

/* PRODUCT */
function addProduct(data={}){
const box=document.createElement("div")
box.className="productBox"
box.innerHTML=`
<input class="input name" placeholder="Tên SP" value="${data.name||''}">
<input type="number" class="input price" placeholder="Giá" value="${data.price||''}">
<input class="input img" placeholder="Link ảnh cách nhau dấu phẩy" value="${data.images?data.images.join(","):""}">
<button onclick="this.parentElement.remove()">Xóa</button>
`
document.getElementById("products").appendChild(box)
}

/* SAVE SHOP */
function saveShop(){

if(!selectedLatLng){
alert("Chọn vị trí trước!")
return
}

if(!editMode && myShopId){
alert("Bạn đã có shop rồi!")
return
}

const id = editMode
? myShopId
: Date.now().toString(36)+Math.random().toString(36).slice(2)

const shop={
id:id,
owner: ownerId,
name:shopName.value,
phone:shopPhone.value,
zalo:shopZalo.value,
avatar:shopAvatar.value,
youtube:shopYoutube.value,
icon: shopIcon.value,
password: shopPassword.value,
online:shopStatus.checked,
lat:selectedLatLng.lat,
lng:selectedLatLng.lng,
products:[]
}

document.querySelectorAll(".productBox").forEach(box=>{
shop.products.push({
name:box.querySelector(".name").value,
price:parseInt(box.querySelector(".price").value||0),
images:box.querySelector(".img").value
.split(",")
.map(i=>i.trim())
.filter(i=>i)
})
})

console.log("Đang gửi shop lên server:", shop)
socket.emit("create_shop", shop)


localStorage.setItem("myShopId", id)
myShopId = id
editMode = false

closeForm()
}








function editShop(id){

    const password = prompt("Nhập mật khẩu để sửa:")

    if(!password) return

    const shop = loadedShopsData[id]

    if(shop.password !== password){
        alert("Sai mật khẩu!")
        return
    }



editMode = true
myShopId = id
selectedLatLng = {lat:shop.lat, lng:shop.lng}

shopName.value = shop.name
shopPhone.value = shop.phone
shopZalo.value = shop.zalo
shopAvatar.value = shop.avatar
shopYoutube.value = shop.youtube
shopIcon.value = shop.icon || "restaurant"
shopStatus.checked = shop.online

document.getElementById("products").innerHTML=""
shop.products.forEach(p=>addProduct(p))

openForm()
}




    
function deleteShop(id){

    const password = prompt("Nhập mật khẩu shop:")

    if(!password) return

    socket.emit("delete_shop", {
        shopId: id,
        password: password
    })


    localStorage.removeItem("myShopId")
    myShopId = null
}


socket.on("disconnect",()=>{
if(myShopId){
socket.emit("shop_offline", myShopId)
}
console.log("Socket disconnected")
})





/* DISTANCE */
function distance(lat1,lng1,lat2,lng2){
const R=6371
const dLat=(lat2-lat1)*Math.PI/180
const dLng=(lng2-lng1)*Math.PI/180
const a=Math.sin(dLat/2)**2+
Math.cos(lat1*Math.PI/180)*
Math.cos(lat2*Math.PI/180)*
Math.sin(dLng/2)**2
return (R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))).toFixed(2)
}

/* YOUTUBE */
function extractYoutubeID(url){
let reg=/[?&]v=([^&#]*)|youtu\.be\/([^&#]*)/
let match=url.match(reg)
return match?(match[1]||match[2]):""
}

/* HASH 32 */
function simpleHash(str){
let h1=0xdeadbeef^str.length
let h2=0x41c6ce57^str.length
for(let i=0;i<str.length;i++){
let ch=str.charCodeAt(i)
h1=Math.imul(h1^ch,2654435761)
h2=Math.imul(h2^ch,1597334677)
}
h1=Math.imul(h1^(h1>>>16),2246822507)
h2=Math.imul(h2^(h2>>>13),3266489909)
return (h2>>>0).toString(16).padStart(8,"0")+
(h1>>>0).toString(16).padStart(8,"0")
}

/* CART */
function addToCart(name,price,shopId){

let shop = loadedShopsData[shopId]

cart.push({
name:name,
price:price,
shopId:shopId,
shopName:shop.name,
shopPhone:shop.phone
})

updateCart()
}







function removeCart(i){
cart.splice(i,1)
updateCart()
}

function updateCart(){
document.getElementById("cartCount").innerText=cart.length
let html=""
let total=0
cart.forEach((i,index)=>{
total+=i.price
html+=`${i.name} - ${i.price} đ 
<button onclick="removeCart(${index})">❌</button><br>`
})
document.getElementById("cartItems").innerHTML=html
document.getElementById("cartTotal").innerText=total
}

function checkout(){

if(cart.length===0){
alert("Giỏ hàng trống!")
return
}

let now=new Date()
let lat=userLocation?userLocation.lat:0
let lng=userLocation?userLocation.lng:0

let grouped = {}

cart.forEach(item=>{
if(!grouped[item.shopId]){
grouped[item.shopId]={
shopName:item.shopName,
shopPhone:item.shopPhone,
items:[],
total:0
}
}
grouped[item.shopId].items.push(item)
grouped[item.shopId].total += item.price
})

let grandTotal = cart.reduce((a,b)=>a+b.price,0)

let raw=now.toISOString()+grandTotal+lat+lng
let hash=simpleHash(raw)

let signature = `
<svg width="220" height="80">
<path d="M10 50 Q 30 10, 50 50 T 90 50 
Q 110 20, 130 55 Q 150 35, 170 55 T 210 45"
stroke="black" fill="transparent"
stroke-width="3" stroke-linecap="round"/>
<text x="40" y="75" font-size="14">
Ben Stormwind
</text>
</svg>
`

let invoiceHTML = `
<div class="invoice">
<b style="font-size:16px">HÓA ĐƠN THANH TOÁN</b><br>
${now.toLocaleString()}<br>
📍 ${lat.toFixed(5)}, ${lng.toFixed(5)}<br>
<hr>
`

Object.values(grouped).forEach(shop=>{

invoiceHTML += `
<div style="margin-bottom:15px;padding:8px;border:1px solid #ddd;border-radius:10px">
<b>🏮 ${shop.shopName}</b><br>
📞 <a href="tel:${shop.shopPhone}" 
style="color:#007bff;text-decoration:none;font-weight:bold;"
onmouseover="this.style.textDecoration='underline'"
onmouseout="this.style.textDecoration='none'">
${shop.shopPhone}
</a>
<hr>
`


shop.items.forEach(i=>{
invoiceHTML += `${i.name} - ${i.price.toLocaleString()} đ<br>`
})

invoiceHTML += `
<hr>
Tổng shop: <b>${shop.total.toLocaleString()} đ</b>
</div>
`
})

invoiceHTML += `
<hr>
<b style="font-size:15px">TỔNG CỘNG: ${grandTotal.toLocaleString()} đ</b><br>
🔐 Hash xác thực: <b>${hash}</b>

<div style="text-align:right;margin-top:15px">
${signature}
</div>

</div>
`

document.getElementById("invoiceArea").innerHTML = invoiceHTML

cart=[]
updateCart()
}





/* RENDER SHOP */
function renderShop(shop){


let isMine = shop.id === myShopId

let icon=L.divIcon({
className:"",
html:`<div class="custom-marker" 
style="
background:${shop.online?'#4caf50':'#555'};
${isMine ? `
box-shadow:0 0 20px gold,0 0 35px orange;
border:4px solid gold;
transform:scale(1.2);
` : ""}
">
${isMine ? "⭐ " : ""}
${businessIcons[shop.icon] || "🏮"}
</div>`,
iconSize: isMine ? [52,52] : [44,44]
})







let html=`
<div class="fairy-header">
<img src="${shop.avatar||'https://via.placeholder.com/60'}" class="fairy-avatar">
<div>
<div class="fairy-title">${shop.name}</div>
<div class="fairy-status">
${shop.online?"🟢 Đang mở cửa":"🔴 Đã đóng cửa"}
</div>
</div>
</div>
`



html += `
<div style="margin-top:8px;font-size:14px">

<a href="tel:${shop.phone}" 
style="display:block;color:#fff;text-decoration:none;margin-bottom:4px">
📞 Gọi: ${shop.phone}
</a>

<a href="https://zalo.me/${shop.phone}" target="_blank"
style="display:block;color:#fff;text-decoration:none;margin-bottom:4px">
💬 Zalo
</a>

<a href="https://wa.me/${shop.phone.replace(/[^0-9]/g,'')}" target="_blank"
style="display:block;color:#fff;text-decoration:none">
🟢 WhatsApp
</a>

</div>
`





if(userLocation){
let d=distance(userLocation.lat,userLocation.lng,shop.lat,shop.lng)
html+=`<div style="font-size:13px;opacity:.7;">📍 Cách bạn ${d} km</div>`
}

if(shop.youtube){
let id=extractYoutubeID(shop.youtube)
if(id){
html+=`
<div style="margin-top:10px">
<iframe width="100%" height="177"
style="border-radius:15px;border:1px solid rgba(255,215,0,0.3)"
src="https://www.youtube.com/embed/${id}"
frameborder="0" allowfullscreen></iframe>
</div>` 
}
}

html += `<div class="fairy-product-row">`

shop.products.forEach(p=>{
html += `
<div class="fairy-product-card">
${p.images && p.images.length
? `<img src="${p.images[0]}">`
: `<div style="height:120px;display:flex;align-items:center;justify-content:center;opacity:.5">Không ảnh</div>`
}
<div class="fairy-product-name">${p.name}</div>
<div class="fairy-product-price">${p.price} đ</div>
<button class="fairy-btn"
onclick="addToCart('${p.name}',${p.price},'${shop.id}')">
Thêm
</button>
</div>
`
})

html += `</div>`





if(shop.id === myShopId){
html += `
<hr>
<button class="fairy-btn" onclick="editShop('${shop.id}')">Sửa</button>
<button class="fairy-btn" onclick="deleteShop('${shop.id}')">Xóa</button>
`
}




let marker=L.marker([shop.lat,shop.lng],{icon})
.addTo(map).bindPopup(html,{maxWidth:350})

markers.push(marker)
}







/* SOCKET */


socket.on("init_shops",(data)=>{
markers.forEach(m=>map.removeLayer(m))
markers=[]
loadedShops={}
loadedShopsData={}

data.forEach(shop=>{
renderShop(shop)
loadedShops[shop.id]=true
loadedShopsData[shop.id]=shop
})
})


socket.on("shop_created",(shop)=>{

    
    if(loadedShopsData[shop.id]){
        markers = markers.filter(m=>{
            const latlng = m.getLatLng()
            const old = loadedShopsData[shop.id]

            if(latlng.lat === old.lat && latlng.lng === old.lng){
                map.removeLayer(m)
                return false
            }
            return true
        })
    }

    renderShop(shop)

    loadedShopsData[shop.id] = shop
})

document.getElementById("cartPanel").classList.toggle("open")

socket.on("shop_deleted",(id)=>{
    markers.forEach(m=>{
        if(loadedShopsData[id] &&
        m.getLatLng().lat === loadedShopsData[id].lat){
            map.removeLayer(m)
        }
    })

    delete loadedShopsData[id]
})

    let lat = parseFloat(document.getElementById("latInput").value)

        alert("Tọa độ không hợp lệ")
        return
    }

    selectedLatLng = {
        lat: lat,
        lng: lng
    }

    map.setView([lat,lng],18)

    openForm()   
}
