<script>
// CANVAS
const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");
function resize(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
window.onresize=resize; resize();

// MINI MAP
const miniMap=document.getElementById("miniMap");
const mmCtx=miniMap.getContext("2d");

// CONSOLE
const gameConsole=document.getElementById("gameConsole");
function log(msg){ const p=document.createElement("div"); p.textContent=msg; gameConsole.appendChild(p); gameConsole.scrollTop=gameConsole.scrollHeight; }

// BACKGROUND
const bg=new Image(); bg.src="https://raw.githubusercontent.com/vilking1996/sohong/main/background.png";

// PLAYER
const player={ x:0, y:0, size:60, speed:4, img:new Image() };
player.img.src="https://raw.githubusercontent.com/vilking1996/sohong/main/player.jpg";

// CAMERA
let camX=0, camY=0;

// MONSTERS
const monsterImg=new Image(); monsterImg.src="https://raw.githubusercontent.com/vilking1996/sohong/main/monster.png";
const bossImg=new Image(); bossImg.src="https://raw.githubusercontent.com/vilking1996/sohong/main/boss.png";
const monsters=[];
for(let i=0;i<5;i++) monsters.push({x:Math.random()*255, y:Math.random()*255, size:70, alive:true, respawnTimer:null});
let boss=null, bossTimer=0;









// 🔐 Auto-generate user ID (SHA256 + random)
function generateUserId() {
    const randomData = Date.now().toString() + Math.random().toString();
    return CryptoJS.SHA256(randomData).toString().slice(0, 16); // 16 ký tự là đủ
}

// 🔍 Lấy user từ local hoặc tự tạo
let user = localStorage.getItem("user");

if (!user) {
    user = "user-" + generateUserId();
    localStorage.setItem("user", user);
    console.log("📌 User mới tạo:", user);
} else {
    console.log("🔍 User đã tồn tại:", user);
}











// GOLD
let gold = localStorage.getItem("gold") ? parseInt(localStorage.getItem("gold")) : 0;

// SOUND
let soundOn=true;
const hitSound=new Audio("hit.mp3");
const goldSound=new Audio("gold.mp3");
document.getElementById("soundBtn").onclick=()=>{
  soundOn=!soundOn;
  document.getElementById("soundBtn").textContent = soundOn?"🔊":"🔇";
};

const base = document.getElementById("joystickBase");
const knob = document.getElementById("joystickKnob");
let joyX = 0, joyY = 0;

function joystickMove(clientX, clientY){
  const r = base.getBoundingClientRect();
  const cx = r.left + r.width/2;
  const cy = r.top + r.height/2;

  let dx = clientX - cx;
  let dy = clientY - cy;

  const maxDist = (base.offsetWidth - knob.offsetWidth) / 2; // giới hạn knob không ra ngoài base
  const dist = Math.sqrt(dx*dx + dy*dy);
  if(dist > maxDist){
    dx = dx / dist * maxDist;
    dy = dy / dist * maxDist;
  }

  knob.style.transform = `translate(${dx}px, ${dy}px)`; // knob di chuyển
  joyX = dx / maxDist;
  joyY = dy / maxDist;
}

function joystickReset(){
  knob.style.transform = "translate(0,0)"; // reset về giữa
  joyX = 0;
  joyY = 0;
}

base.addEventListener("touchstart", e=>{ joyX=0; joyY=0; });
base.addEventListener("touchmove", e=>{ joystickMove(e.touches[0].clientX, e.touches[0].clientY); });
base.addEventListener("touchend", e=>{ joystickReset(); });


// KEYBOARD
const key={w:0,a:0,s:0,d:0};
document.addEventListener("keydown", e=>{ if(key[e.key]!==undefined) key[e.key]=1; });
document.addEventListener("keyup", e=>{ if(key[e.key]!==undefined) key[e.key]=0; });

// UPDATE
function update(){
  let vx = key.d - key.a + joyX;
  let vy = key.s - key.w + joyY;
  const len=Math.sqrt(vx*vx+vy*vy);
  if(len>0){ vx/=len; vy/=len; }
  player.x+=vx*player.speed;
  player.y+=vy*player.speed;

  // giới hạn tới mép background
  player.x=Math.max(0, Math.min(player.x, bg.width-player.size));
  player.y=Math.max(0, Math.min(player.y, bg.height-player.size));

  // CAMERA theo player
  camX = player.x - canvas.width/2;
  camY = player.y - canvas.height/2;
  camX=Math.max(0, Math.min(camX, bg.width - canvas.width));
  camY=Math.max(0, Math.min(camY, bg.height - canvas.height));

  // va chạm monsters
  monsters.forEach(m=>{
    if(m.alive){
      const dx = m.x - player.x;
      const dy = m.y - player.y;
      if(Math.abs(dx)<40 && Math.abs(dy)<40){
        m.alive=false;
        m.respawnTimer = Date.now(); // đánh dấu thời gian chết
        const drop = Math.random()<0.5?10:-5;
        gold += drop;
        log(drop>0?"Nhặt vàng +"+drop:"Trừ vàng "+drop);
        if(soundOn) drop>0?goldSound.play():hitSound.play();
      }
    } else {
      // respawn monster sau 2 giây
      if(Date.now() - m.respawnTimer > 2000){
        m.x = Math.random()*bg.width;
        m.y = Math.random()*bg.height;
        m.alive = true;
        m.respawnTimer = null;
        log("Monster tái sinh!");
      }
    }
  });

  // Boss xuất hiện / respawn
  bossTimer++;
  if(!boss){
    if(bossTimer > Math.random()*1000+500){
      boss={x:Math.random()*bg.width, y:Math.random()*bg.height, size:100, alive:true, spawnTime:Date.now(), respawnTime:null};
      bossTimer=0;
      log("Boss xuất hiện!");
    }
  } else if(!boss.alive){
    if(Date.now() - boss.respawnTime > 255000){
      boss={x:Math.random()*bg.width, y:Math.random()*bg.height, size:100, alive:true, spawnTime:Date.now(), respawnTime:null};
      log("Boss tái xuất!");
    }
  }

  // Boss rượt player
  if(boss && boss.alive){
    const dx=player.x-boss.x;
    const dy=player.y-boss.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    const speed=2;
    boss.x+=dx/dist*speed;
    boss.y+=dy/dist*speed;

    if(dist < 70){
  gold -= 17; // trừ 17 dù gold đang âm hay dương
  boss.alive = false;
  boss.respawnTime = Date.now();
  log(`Boss đánh trúng! -17 vàng (tổng hiện tại: ${gold})`);
  if(soundOn) hitSound.play();
}

  }

  // Lưu offline
  localStorage.setItem("gold", gold);

  // Gửi server khi online
  
}

// DRAW
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(bg, -camX, -camY, bg.width, bg.height);

  monsters.forEach(m=>{ if(m.alive) ctx.drawImage(monsterImg, m.x-camX, m.y-camY, m.size, m.size); });
  if(boss && boss.alive) ctx.drawImage(bossImg, boss.x-camX, boss.y-camY, boss.size, boss.size);
  ctx.drawImage(player.img, player.x-camX, player.y-camY, player.size, player.size);

  ctx.fillStyle="yellow";
  ctx.font="30px Arial";
  ctx.fillText("Gold: "+gold, 20, 40);

  // MINI MAP
  mmCtx.clearRect(0,0,miniMap.width,miniMap.height);
  mmCtx.fillStyle="black";
  mmCtx.fillRect(0,0,miniMap.width,miniMap.height);
  const scaleX=miniMap.width/bg.width;
  const scaleY=miniMap.height/bg.height;

  monsters.forEach(m=>{ if(m.alive){ mmCtx.fillStyle="red"; mmCtx.fillRect(m.x*scaleX,m.y*scaleY,4,4); } });
  if(boss && boss.alive){ mmCtx.fillStyle="orange"; mmCtx.fillRect(boss.x*scaleX,boss.y*scaleY,6,6); }
  mmCtx.fillStyle="blue"; mmCtx.fillRect(player.x*scaleX,player.y*scaleY,6,6);
}

// LOOP
function gameLoop(){ update(); draw(); requestAnimationFrame(gameLoop); }
gameLoop();
</script>

<script>
let userLat = null, userLng = null;

// Lấy vị trí người dùng
if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(
    pos => { userLat = pos.coords.latitude.toFixed(6); userLng = pos.coords.longitude.toFixed(6); },
    () => { alert("Vui lòng cho phép vị trí để sử dụng tính năng giao dịch!"); }
  );
}else{
  alert("Trình duyệt không hỗ trợ Geolocation");
}

// Nút kéo nổi
const btn = document.getElementById("transactionBtn");
const popup = document.getElementById("transactionPopup");
let isDragging=false, offsetX=0, offsetY=0, moved=false;

btn.addEventListener("mousedown", e=>{
  isDragging=true; moved=false;
  offsetX = e.clientX - btn.offsetLeft;
  offsetY = e.clientY - btn.offsetTop;
});
document.addEventListener("mousemove", e=>{
  if(isDragging){
    btn.style.left = (e.clientX - offsetX) + "px";
    btn.style.top = (e.clientY - offsetY) + "px";
    moved = true;
  }
});
document.addEventListener("mouseup", ()=>{ isDragging=false; });

btn.addEventListener("touchstart", e=>{
  isDragging=true; moved=false;
  const t = e.touches[0];
  offsetX = t.clientX - btn.offsetLeft;
  offsetY = t.clientY - btn.offsetTop;
});
document.addEventListener("touchmove", e=>{
  if(isDragging){
    const t = e.touches[0];
    btn.style.left = (t.clientX - offsetX) + "px";
    btn.style.top = (t.clientY - offsetY) + "px";
    moved = true;
  }
});
document.addEventListener("touchend", ()=>{ isDragging=false; });

// Mở popup chỉ khi click (không kéo)
btn.addEventListener("click", ()=>{
  if(!moved){
    popup.style.display = "flex";
  }
});

// Đóng popup
document.getElementById("closePopup").addEventListener("click", ()=>{
  popup.style.display = "none";
});

// Tạo QR code
document.getElementById("generateQR").addEventListener("click", ()=>{
  if(userLat===null || userLng===null){ alert("Chưa có vị trí!"); return; }

  const receive = document.getElementById("receiveInput").value.trim();
  const goldInput = parseInt(document.getElementById("goldInput").value);
  if(!receive || isNaN(goldInput) || goldInput<=0){ alert("Nhập đầy đủ và >0!"); return; }

  if(typeof gold==='undefined') gold=1000;
  if(gold < goldInput){ alert("Vàng không đủ!"); return; }
  gold -= goldInput;
  localStorage.setItem("gold", gold);

  const userOffline = localStorage.getItem("user") || "user123";
  const serverLink = localStorage.getItem("server") || "https://blockchain-backup-server-2.onrender.com/save";

  const coord = {x:0, y:0, lat:userLat, lng:userLng};
  const now = new Date().toISOString();

  const tx = {
    user: userOffline,
    receive: receive,
    gold: -goldInput,
    datetime: now,
    coord: coord,
    server: serverLink,
    serverHash: CryptoJS.SHA256(now + coord.x + coord.y + userLat + userLng + receive + goldInput).toString()
  };

  const txBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(tx))));

  const canvasQR = document.getElementById("qrCodeCanvas");
  canvasQR.width = 148;
  canvasQR.height = 148;

  QRCode.toCanvas(canvasQR, txBase64, {width:150}, function(error){
    if(error) console.error(error);
    else{
      const ctx = canvasQR.getContext("2d");
      ctx.font = "bold 14px Arial";
      ctx.fillStyle = "hotpink";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("Stormwind", canvasQR.width/2, canvasQR.height/2);
    }
  });
});
</script>














<script>
// --- Biến global ---
userLat = null;
userLng = null;
gpsReady = false;

// --- Lấy vị trí người dùng ---
if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
        (pos) => {
            userLat = Number(pos.coords.latitude);
            userLng = Number(pos.coords.longitude);
            gpsReady = true;
            console.log("GPS ready:", userLat, userLng);
        },
        (err) => {
            console.warn("Không lấy được GPS:", err.message);
            userLat = 0;
            userLng = 0;
            gpsReady = true;
        }
    );
} else {
    console.warn("Trình duyệt không hỗ trợ Geolocation");
    userLat = 0;
    userLng = 0;
    gpsReady = true;
}

// --- Hàm tạo block ---
function createBlock(user, gold, consoleLog, coord){
    const timestamp = new Date().toISOString();

    const blockData = { user, gold, console: consoleLog, coord, timestamp };
    const blockString = JSON.stringify(blockData);
    const hash = CryptoJS.SHA256(blockString).toString();

    const block = { ...blockData, hash };
    return block;
}

// --- Hàm gửi block lên server ---
function sendBlockToServer(block){
    console.log("Sending block:", block);
    fetch("https://blockchain-backup-server-2.onrender.com/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(block)
    })
    .then(res => res.text())
    .then(txt => console.log("Server response:", txt))
    .catch(e => console.log("Lỗi gửi server", e));
}

// --- Hàm commit dữ liệu game ---
function commitGameData(){
    if(!gpsReady){
        console.log("GPS chưa sẵn sàng, commit skipped");
        return;
    }

    const user = localStorage.getItem("user") || "user123";
    const consoleEl = document.getElementById("gameConsole");
    const consoleLog = consoleEl ? Array.from(consoleEl.children).map(div => div.textContent) : [];

    if(typeof gold !== "number"){
        console.log("Gold invalid, commit skipped");
        return;
    }

    const coord = { lat: userLat, lng: userLng };
    const block = createBlock(user, gold, consoleLog, coord);

    sendBlockToServer(block);
}

// --- Tự động gửi khi Gold thay đổi ---
let prevGold = gold;
setInterval(() => {
    if(gold !== prevGold){
        commitGameData();
        prevGold = gold;
    }
}, 2000);



// --- Nút test thủ công ---
document.addEventListener("DOMContentLoaded", () => {
    const testBtn = document.createElement("button");
    testBtn.textContent = "Save Blockchain";
    testBtn.style.position = "fixed";
    testBtn.style.bottom = "0.5px";
    testBtn.style.right = "10px";
    testBtn.style.zIndex = 9999;
    testBtn.addEventListener("click", commitGameData);
    document.body.appendChild(testBtn);
});
</script>

<script>
// --- AI giám sát vàng tăng bất thường ---
let lastGoldCheck = gold;
const goldCheckInterval = 1710; // kiểm tra mỗi 1.710 giây

        }
    }

    lastGoldCheck = currentGold;
}, goldCheckInterval);

<script>
const policeCar = document.getElementById("policeCar");
const abnormalUserDiv = document.getElementById("abnormalUser");
const siren = document.getElementById("siren");

// Lấy dữ liệu Gold.txt từ GitHub
async function fetchGoldLogs(){
  try{
    const response = await fetch("https://raw.githubusercontent.com/vilking1996/sohong/main/Gold/Gold.txt");
    if(!response.ok) throw new Error("Không tải được Gold.txt");
    const text = await response.text();
    const lines = text.split(/\r?\n/).filter(l=>l.trim()!=="");
    return lines;
  }catch(e){
    console.error(e);
    return [];
  }
}

// Kiểm tra gold bất thường
async function checkGoldChanges(){
  const logs = await fetchGoldLogs();
  logs.forEach(log=>{
    if(log.includes("Gold tăng bất thường")){
      const userMatch = log.match(/\| (.+?) \| Gold/);
      if(userMatch){
        const userName = userMatch[1];
        abnormalUserDiv.innerText = userName;
        triggerAlert(userName);
      }
    }
  });
}

// Cảnh báo: siren + nhấp nháy + di chuyển xe
function triggerAlert(userName){
  siren.play();

  // Nhấp nháy nóc xe
  let flash = true;
  const roof = policeCar.querySelector('rect:nth-child(2)');
  const flashInterval = setInterval(()=>{
    roof.setAttribute('fill', flash?'red':'yellow');
    flash = !flash;
  },300);

  // Di chuyển xe tới nhà tù
  let carX = 0;
  const prison = document.getElementById("prison");
  const targetX = parseInt(prison.style.left) - 60; // left nhà tù - width xe
  const moveInterval = setInterval(()=>{
    if(carX < targetX){
      carX += 5;
      policeCar.style.left = carX + "px";
      abnormalUserDiv.style.left = (carX + 70) + "px"; // user đi theo xe
    }else{
      clearInterval(moveInterval);
      clearInterval(flashInterval);
      roof.setAttribute('fill','red');
    }
  },50);
}





let alertActive = false; // cờ cảnh báo đang chạy

<script>
  const goldIcon = document.getElementById("goldIcon");
  const goldPopup = document.getElementById("goldPopup");
  const goldList = document.getElementById("goldList");
  const goldSearch = document.getElementById("goldSearch");













  let lastClickTime = 0;

goldIcon.addEventListener("click", () => {
  const now = Date.now();

  // Nếu click 2 lần trong vòng 400ms → tải file
  if (now - lastClickTime < 400) {
    if (lines.length > 0) {
      const blob = new Blob([lines.join("\n")], { type: "text/plain" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "Gold.txt";
      a.click();
      URL.revokeObjectURL(a.href);
    }
    lastClickTime = 0; // reset
    return;
  }
  lastClickTime = now;

  // Click 1 lần → mở/đóng popup
  if (goldPopup.classList.contains("show")) {
    goldPopup.classList.remove("show");
    setTimeout(() => goldPopup.style.display = "none", 200);
  } else {
    goldPopup.style.display = "block";
    setTimeout(() => goldPopup.classList.add("show"), 10);
    animateGoldList(); // kích hoạt hiệu ứng từng dòng
  }
});
















  let lines = [];
  async function loadGoldList() {
    try {
      const url = "https://raw.githubusercontent.com/vilking1996/sohong/main/Gold/Gold.txt";
      const res = await fetch(url);
      const text = await res.text();
      lines = text.split("\n").filter(line => line.trim() !== "");
      renderGoldList(); // render ban đầu
    } catch(err) {
      goldList.innerHTML = "<div class='goldItem'>Không thể tải dữ liệu</div>";
      console.error(err);
    }
  }


  function renderGoldList() {
    goldList.innerHTML = "";
    lines.forEach(line => {
      const div = document.createElement("div");
      div.className = "goldItem";
      div.textContent = line;
      goldList.appendChild(div);
    });
  }

  // Hiệu ứng từng dòng nhảy nhót
  function animateGoldList() {
    const items = goldList.querySelectorAll(".goldItem");
    items.forEach((item, index) => {
      item.classList.remove("show");
      item.style.opacity = 0;
      item.style.transform = "translateX(-20px)";
      setTimeout(() => item.classList.add("show"), index * 50); // delay 50ms mỗi dòng
    });
  }

  // Filter search tối ưu
  goldSearch.addEventListener("input", () => {
    const query = goldSearch.value.toLowerCase();
    requestAnimationFrame(() => {
      goldList.querySelectorAll(".goldItem").forEach(item => {
        item.style.display = item.textContent.toLowerCase().includes(query) ? "block" : "none";
      });
    });
  });

  loadGoldList();
</script>
